<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Dashboard - Price My Ride</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Poppins', sans-serif;
        }

        body { 
            display: flex; 
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
        }

        /* Animated Sidebar */
        .sidebar { 
            width: 280px; 
            background: linear-gradient(180deg, #0d1b2a 0%, #1b263b 100%);
            color: white; 
            display: flex; 
            flex-direction: column;
            padding: 30px 20px;
            box-shadow: 5px 0 30px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        .sidebar::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(0, 123, 255, 0.1) 0%, transparent 70%);
            animation: rotate 20s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .sidebar-logo {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
            z-index: 1;
        }

        /* Modern CSS Logo */
        .sidebar-logo-img {
            width: 70px;
            height: 70px;
            border-radius: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 30px rgba(102, 126, 234, 0.5);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .sidebar-logo-img::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255,255,255,0.3) 0%, transparent 50%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .sidebar-logo-img:hover::before {
            opacity: 1;
        }

        .sidebar-logo-img:hover {
            transform: scale(1.1) rotate(5deg);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.7);
        }

        .sidebar-logo-img i {
            font-size: 35px;
            color: white;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }

        .sidebar-logo h2 {
            margin-top: 15px;
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea, #764ba2, #f093fb);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientMove 3s ease infinite;
            letter-spacing: 0.5px;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .sidebar .item { 
            margin: 12px 0; 
            padding: 18px 25px; 
            background: linear-gradient(135deg, rgba(0, 123, 255, 0.2), rgba(0, 212, 255, 0.1));
            border: 1px solid rgba(0, 123, 255, 0.3);
            border-radius: 15px;
            text-align: left;
            cursor: pointer; 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            gap: 15px;
            position: relative;
            z-index: 1;
            color: white;
            font-weight: 500;
        }

        .sidebar .item i {
            font-size: 18px;
            width: 25px;
            text-align: center;
        }

        .sidebar .item:hover { 
            background: linear-gradient(135deg, #007BFF, #00d4ff);
            transform: translateX(10px) scale(1.02);
            box-shadow: 0 10px 30px rgba(0, 123, 255, 0.4);
        }

        .sidebar .item:active {
            transform: translateX(10px) scale(0.98);
        }

        /* Main Content */
        .main-content { 
            flex-grow: 1; 
            padding: 30px;
            display: flex;
            flex-direction: column;
            background: rgba(255, 255, 255, 0.02);
        }

        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 25px 35px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: slideDown 0.5s ease-out;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header h2 {
            font-size: 24px;
            font-weight: 600;
            color: white;
        }

        .header h2 span {
            background: linear-gradient(135deg, #00d4ff, #007BFF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .user-options button {
            padding: 12px 30px;
            background: linear-gradient(135deg, #ff6b6b, #ee5a5a);
            border: none;
            border-radius: 50px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(255, 107, 107, 0.3);
        }

        .user-options button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255, 107, 107, 0.5);
        }

        .content { 
            margin-top: 20px; 
            animation: fadeIn 0.5s ease-out 0.3s both;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .content h1 {
            color: white;
            margin-bottom: 30px;
            font-size: 32px;
            font-weight: 600;
        }

        /* Car Item Styling */
        .car-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 20px 25px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            margin: 15px 0; 
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            animation: slideIn 0.4s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .car-item:hover { 
            background: rgba(255, 255, 255, 0.15);
            transform: translateX(10px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .car-item span {
            color: white;
            font-weight: 500;
        }

        .car-item strong {
            color: #00d4ff;
        }

        .sell-btn, .book-btn, .pay-btn { 
            border: none; 
            padding: 12px 25px; 
            border-radius: 50px; 
            cursor: pointer; 
            margin-left: 10px;
            font-weight: 600;
            transition: all 0.3s ease;
            color: white;
        }

        .sell-btn { 
            background: linear-gradient(135deg, #ffc107, #ffb300);
            box-shadow: 0 5px 15px rgba(255, 193, 7, 0.3);
        }

        .book-btn { 
            background: linear-gradient(135deg, #28a745, #20c997);
            box-shadow: 0 5px 15px rgba(40, 167, 69, 0.3);
        }

        .pay-btn { 
            background: linear-gradient(135deg, #007BFF, #00d4ff);
            box-shadow: 0 5px 15px rgba(0, 123, 255, 0.3);
        }

        .sell-btn:hover { 
            background: linear-gradient(135deg, #ffb300, #ffc107);
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(255, 193, 7, 0.5);
        }

        .book-btn:hover { 
            background: linear-gradient(135deg, #20c997, #28a745);
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(40, 167, 69, 0.5);
        }

        .pay-btn:hover { 
            background: linear-gradient(135deg, #00d4ff, #007BFF);
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 123, 255, 0.5);
        }

        /* Add Car Button */
        .add-car-btn {
            padding: 15px 35px;
            background: linear-gradient(135deg, #28a745, #20c997);
            border: none;
            border-radius: 50px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(40, 167, 69, 0.3);
            margin-bottom: 25px;
        }

        .add-car-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(40, 167, 69, 0.5);
        }

        /* Stats Cards */
        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .stat-card {
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            transition: all 0.3s ease;
            animation: fadeIn 0.5s ease-out both;
        }

        .stat-card:nth-child(1) {
            background: linear-gradient(135deg, #e3f2fd, #bbdefb);
            animation-delay: 0.1s;
        }

        .stat-card:nth-child(2) {
            background: linear-gradient(135deg, #c8e6c9, #a5d6a7);
            animation-delay: 0.2s;
        }

        .stat-card:nth-child(3) {
            background: linear-gradient(135deg, #fff3e0, #ffe0b2);
            animation-delay: 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }

        .stat-card h3 {
            color: #333;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-card p {
            color: #333;
            font-size: 28px;
            font-weight: 700;
        }

        /* Welcome Message */
        .welcome-content {
            text-align: center;
            padding: 100px 20px;
        }

        .welcome-content h1 {
            font-size: 48px;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #00d4ff, #007BFF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 20px rgba(0, 212, 255, 0.5); }
            to { text-shadow: 0 0 40px rgba(0, 212, 255, 0.8); }
        }

        .welcome-content p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 18px;
        }

        /* QR Code */
        .qr-code {
            margin-top: 15px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                width: 80px;
                padding: 20px 10px;
            }

            .sidebar-logo h2 {
                display: none;
            }

            .sidebar .item span {
                display: none;
            }

            .sidebar .item {
                justify-content: center;
                padding: 15px;
            }

            .sidebar .item i {
                margin: 0;
            }
        }

        /* Prediction Form Styles */
        .prediction-form {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 600px;
            margin: 0 auto;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: white;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 14px;
            font-family: 'Poppins', sans-serif;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #00d4ff;
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
        }

        .form-group select option {
            background: #1b263b;
            color: white;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .predict-btn {
            width: 100%;
            padding: 15px 35px;
            background: linear-gradient(135deg, #007BFF, #00d4ff);
            border: none;
            border-radius: 50px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(0, 123, 255, 0.3);
            margin-top: 10px;
        }

        .predict-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 123, 255, 0.5);
        }

        .predict-btn:disabled {
            background: #666;
            cursor: not-allowed;
            transform: none;
        }

        .prediction-result {
            margin-top: 30px;
            padding: 25px;
            background: linear-gradient(135deg, rgba(40, 167, 69, 0.2), rgba(32, 201, 151, 0.2));
            border-radius: 15px;
            border: 1px solid rgba(40, 167, 69, 0.5);
            text-align: center;
            animation: fadeIn 0.5s ease-out;
        }

        .prediction-result h3 {
            color: #20c997;
            font-size: 18px;
            margin-bottom: 10px;
        }

        .prediction-result .price {
            font-size: 36px;
            font-weight: 700;
            color: #00d4ff;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
        }

        .prediction-error {
            margin-top: 30px;
            padding: 25px;
            background: rgba(255, 107, 107, 0.2);
            border-radius: 15px;
            border: 1px solid rgba(255, 107, 107, 0.5);
            text-align: center;
            color: #ff6b6b;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .service-status {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            margin-left: 15px;
        }

        .service-status.available {
            background: rgba(40, 167, 69, 0.3);
            color: #20c997;
        }

        .service-status.unavailable {
            background: rgba(255, 107, 107, 0.3);
            color: #ff6b6b;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-logo">
            <div class="sidebar-logo-img">
                <i class="fas fa-car"></i>
            </div>
            <h2>Price My Ride</h2>
        </div>
        <div class="item" onclick="loadPage('predict-price')">
            <i class="fas fa-calculator"></i>
            <span>Predict & Sell Car</span>
        </div>
        <div class="item" onclick="loadPage('sell-car')">
            <i class="fas fa-tags"></i>
            <span>Car for Sell</span>
        </div>
        <div class="item" onclick="loadPage('booking-sell')">
            <i class="fas fa-calendar-check"></i>
            <span>Booking Car for Sell</span>
        </div>
        <div class="item" onclick="loadPage('payment')">
            <i class="fas fa-credit-card"></i>
            <span>Payment Process</span>
        </div>
        <div class="item" onclick="loadPage('sell-records')">
            <i class="fas fa-chart-line"></i>
            <span>Car Sell Record</span>
        </div>
    </div>

    <div class="main-content">
        <div class="header">
            <h2 id="username">Welcome, <span>User</span></h2>
            <div class="user<button onclick="logout()">
                    <i class-options">
                ="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </div>
        <div class="content" id="content">
            <div class="welcome-content">
                <h1>Welcome to the Dashboard</h1>
                <p>Select an option from the sidebar to get started.</p>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            if (!localStorage.getItem("token")) {
                window.location.href = "login.html";
            }
            loadUserInfo();
        });

        function logout() {
            localStorage.removeItem("token");
            localStorage.removeItem("userEmail");
            window.location.href = "login.html";
        }

        function loadUserInfo() {
            const userEmail = localStorage.getItem('userEmail') || 'User';
            document.getElementById("username").innerHTML = 'Welcome, <span>' + userEmail + '</span>';
        }

        function loadPage(page) {
            let content = document.getElementById("content");

            if (page === "predict-price") {
                content.innerHTML = `
                    <h1><i class="fas fa-calculator"></i> Predict & Sell Car</h1>
                    <div class="prediction-form">
                        <div class="form-row">
                            <div class="form-group">
                                <label>Car Brand</label>
                                <select id="predBrand">
                                    <option value="Maruti">Maruti</option>
                                    <option value="Hyundai">Hyundai</option>
                                    <option value="Honda">Honda</option>
                                    <option value="Toyota">Toyota</option>
                                    <option value="Ford">Ford</option>
                                    <option value="Tata">Tata</option>
                                    <option value="Mahindra">Mahindra</option>
                                    <option value="Volkswagen">Volkswagen</option>
                                    <option value="Skoda">Skoda</option>
                                    <option value="Kia">Kia</option>
                                    <option value="MG">MG</option>
                                    <option value="Nissan">Nissan</option>
                                    <option value="Renault">Renault</option>
                                    <option value="BMW">BMW</option>
                                    <option value="Mercedes-Benz">Mercedes-Benz</option>
                                    <option value="Audi">Audi</option>
                                    <option value="Jaguar">Jaguar</option>
                                    <option value="Volvo">Volvo</option>
                                    <option value="Chevrolet">Chevrolet</option>
                                    <option value="Fiat">Fiat</option>
                                    <option value="Jeep">Jeep</option>
                                    <option value="Datsun">Datsun</option>
                                    <option value="Mitsubishi">Mitsubishi</option>
                                    <option value="Lexus">Lexus</option>
                                    <option value="Land">Land Rover</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Car Model</label>
                                <input type="text" id="predModel" placeholder="e.g., Swift, Creta, City" value="">
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Year of Manufacture</label>
                            <input type="number" id="predYear" min="1990" max="2025" value="2020" placeholder="Enter year">
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Kilometers Driven</label>
                                <input type="number" id="predKmDriven" min="0" value="10000" placeholder="Enter km driven">
                            </div>
                            <div class="form-group">
                                <label>Mileage (km/l)</label>
                                <input type="number" id="predMileage" min="0" step="0.1" value="20" placeholder="Enter mileage">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Engine (CC)</label>
                                <input type="number" id="predEngine" min="0" value="1500" placeholder="Enter engine cc">
                            </div>
                            <div class="form-group">
                                <label>Max Power (bhp)</label>
                                <input type="number" id="predMaxPower" min="0" step="0.1" value="120" placeholder="Enter max power">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Fuel Type</label>
                                <select id="predFuel">
                                    <option value="Petrol">Petrol</option>
                                    <option value="Diesel">Diesel</option>
                                    <option value="CNG">CNG</option>
                                    <option value="LPG">LPG</option>
                                    <option value="Electric">Electric</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Transmission</label>
                                <select id="predTransmission">
                                    <option value="Manual">Manual</option>
                                    <option value="Automatic">Automatic</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Seller Type</label>
                                <select id="predSellerType">
                                    <option value="Individual">Individual</option>
                                    <option value="Dealer">Dealer</option>
                                    <option value="Trustmark Dealer">Trustmark Dealer</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Owner Type</label>
                                <select id="predOwner">
                                    <option value="First Owner">First Owner</option>
                                    <option value="Second Owner">Second Owner</option>
                                    <option value="Third Owner">Third Owner</option>
                                    <option value="Fourth & Above Owner">Fourth & Above Owner</option>
                                    <option value="Test Drive Car">Test Drive Car</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Number of Seats</label>
                            <select id="predSeats">
                                <option value="2">2 Seats</option>
                                <option value="4">4 Seats</option>
                                <option value="5" selected>5 Seats</option>
                                <option value="6">6 Seats</option>
                                <option value="7">7 Seats</option>
                                <option value="8">8 Seats</option>
                            </select>
                        </div>
                        <button class="predict-btn" onclick="predictPrice()">
                            <i class="fas fa-calculator"></i> Predict Price
                        </button>
                        <div id="predictionResult"></div>
                    </div>
                `;
            } else if (page === "sell-car") {
                content.innerHTML = `
                    <h1><i class="fas fa-tags"></i> Cars for Sell</h1>
                    <ul id="sellCarList"></ul>
                `;
                displaySellCars();
            } else if (page === "booking-sell") {
                content.innerHTML = `
                    <h1><i class="fas fa-calendar-check"></i> Booked Cars</h1>
                    <ul id="bookedCarList"></ul>
                `;
                displayBookedCars();
            } else if (page === "payment") {
                content.innerHTML = `
                    <h1><i class="fas fa-credit-card"></i> Payment Process</h1>
                    <ul id="paymentList"></ul>
                `;
                displayPayments();
            } else if (page === "sell-records") {
                content.innerHTML = `
                    <h1><i class="fas fa-chart-line"></i> Car Sell Record</h1>
                    <div class="stats-container">
                        <div class="stat-card">
                            <h3>Total Cars Added</h3>
                            <p id="totalAddedCars">0</p>
                            <p id="totalAddedPrice">₹0</p>
                        </div>
                        <div class="stat-card">
                            <h3>Total Cars Sold</h3>
                            <p id="totalSoldCars">0</p>
                            <p id="totalSoldPrice">₹0</p>
                        </div>
                        <div class="stat-card">
                            <h3>Total Profit</h3>
                            <p id="totalProfit">₹0</p>
                        </div>
                    </div>
                `;
                displaySellRecords();
            } else {
                content.innerHTML = `<h1>Loading ${page.replace("-", " ")}...</h1>`;
            }
        }

        function addCar() {
            let brand = prompt("Enter car brand:");
            if (!brand) return;

            let model = prompt("Enter car model:");
            if (!model) return;

            let price = prompt("Enter car price in ₹:");
            if (!price || isNaN(price)) return alert("Please enter a valid price!");

            let cars = JSON.parse(localStorage.getItem("availableCars")) || [];
            cars.push({ brand, model, price });
            localStorage.setItem("availableCars", JSON.stringify(cars));

            displayCars();
        }

        function displayCars() {
            let cars = JSON.parse(localStorage.getItem("availableCars")) || [];
            let carList = document.getElementById("carList");
            if (cars.length === 0) {
                carList.innerHTML = '<p style="color: rgba(255,255,255,0.6); text-align: center; padding: 30px;">No cars available. Click "Add Car" to add one.</p>';
                return;
            }
            carList.innerHTML = cars.map((car, index) => `
                <li class="car-item">
                    <span><strong>${car.brand}</strong> ${car.model} - <span style="color: #00d4ff;">₹${car.price}</span></span>
                    <button class="sell-btn" onclick="moveToSell(${index})">
                        <i class="fas fa-tag"></i> Move to Sell
                    </button>
                </li>
            `).join("");
        }

        function moveToSell(index) {
            let cars = JSON.parse(localStorage.getItem("availableCars")) || [];
            let sellCars = JSON.parse(localStorage.getItem("sellCars")) || [];

            let car = cars[index];
            let sellingPrice = prompt(`Enter selling price for ${car.brand} ${car.model} (₹):`, car.price);
            if (!sellingPrice || isNaN(sellingPrice)) return alert("Please enter a valid selling price!");

            car.originalPrice = Number(car.price);
            car.sellingPrice = Number(sellingPrice);

            sellCars.push(car);
            localStorage.setItem("sellCars", JSON.stringify(sellCars));

            cars.splice(index, 1);
            localStorage.setItem("availableCars", JSON.stringify(cars));

            displayCars();
            displaySellCars();
        }

        function displaySellCars() {
            let sellCars = JSON.parse(localStorage.getItem("sellCars")) || [];
            let sellCarList = document.getElementById("sellCarList");
            if (sellCars.length === 0) {
                sellCarList.innerHTML = '<p style="color: rgba(255,255,255,0.6); text-align: center; padding: 30px;">No cars for sale. Move cars from "Cars Available" section.</p>';
                return;
            }
            sellCarList.innerHTML = sellCars.map((car, index) => `
                <li class="car-item">
                    <span><strong>${car.brand}</strong> ${car.model} - <span style="color: #00d4ff;">₹${car.sellingPrice || car.price}</span></span>
                    <button class="book-btn" onclick="bookCar(${index})">
                        <i class="fas fa-calendar-check"></i> Book
                    </button>
                </li>
            `).join("");
        }

        function bookCar(index) {
            let sellCars = JSON.parse(localStorage.getItem("sellCars")) || [];
            let bookedCars = JSON.parse(localStorage.getItem("bookedCars")) || [];

            bookedCars.push(sellCars[index]);
            localStorage.setItem("bookedCars", JSON.stringify(bookedCars));

            sellCars.splice(index, 1);
            localStorage.setItem("sellCars", JSON.stringify(sellCars));

            displaySellCars();
            displayBookedCars();
        }

        function displayBookedCars() {
            let bookedCars = JSON.parse(localStorage.getItem("bookedCars")) || [];
            let bookedCarList = document.getElementById("bookedCarList");
            if (bookedCars.length === 0) {
                bookedCarList.innerHTML = '<p style="color: rgba(255,255,255,0.6); text-align: center; padding: 30px;">No booked cars yet.</p>';
                return;
            }
            bookedCarList.innerHTML = bookedCars.map((car, index) => `
                <li class="car-item">
                    <span><strong>${car.brand}</strong> ${car.model} - <span style="color: #00d4ff;">₹${car.sellingPrice || car.price}</span></span>
                    <button class="pay-btn" onclick="processPayment(${index})">
                        <i class="fas fa-credit-card"></i> Make Payment
                    </button>
                </li>
            `).join("");
        }

        function processPayment(index) {
            let bookedCars = JSON.parse(localStorage.getItem("bookedCars")) || [];
            let payments = JSON.parse(localStorage.getItem("payments")) || [];

            let car = bookedCars[index];
            payments.push(car);
            localStorage.setItem("payments", JSON.stringify(payments));

            bookedCars.splice(index, 1);
            localStorage.setItem("bookedCars", JSON.stringify(bookedCars));

            displayBookedCars();
            displayPayments();
        }

        function displayPayments() {
            let payments = JSON.parse(localStorage.getItem("payments")) || [];
            let paymentList = document.getElementById("paymentList");
            if (payments.length === 0) {
                paymentList.innerHTML = '<p style="color: rgba(255,255,255,0.6); text-align: center; padding: 30px;">No payments yet.</p>';
                return;
            }
            paymentList.innerHTML = payments.map((car, idx) => `
                <li class="car-item">
                    <span><strong>${car.brand}</strong> ${car.model} - <span style="color: #00d4ff;">₹${car.sellingPrice || car.price}</span></span>
                    <canvas id="qr-${idx}" class="qr-code"></canvas>
                </li>
            `).join("");

            payments.forEach((car, idx) => {
                new QRious({
                    element: document.getElementById(`qr-${idx}`),
                    value: `Pay ₹${car.sellingPrice || car.price} for ${car.brand} ${car.model}`,
                    size: 100
                });
            });
        }

        function displaySellRecords() {
            const availableCars = JSON.parse(localStorage.getItem("availableCars")) || [];
            const payments = JSON.parse(localStorage.getItem("payments")) || [];
            
            const totalAddedCars = availableCars.length;
            const totalAddedPrice = availableCars.reduce(
                (sum, car) => sum + Number(car.originalPrice || car.price),
                0
            );
            
            const totalSoldCars = payments.length;
            const totalSoldPrice = payments.reduce(
                (sum, car) => sum + Number(car.sellingPrice || car.price),
                0
            );
            
            const totalProfit = payments.reduce((sum, car) => {
                const sell = Number(car.sellingPrice || car.price);
                const orig = Number(car.originalPrice || car.price);
                return sum + (sell - orig);
            }, 0);
            
            document.getElementById("totalAddedCars").innerText = `Count: ${totalAddedCars}`;
            document.getElementById("totalAddedPrice").innerText = `₹${totalAddedPrice}`;
            document.getElementById("totalSoldCars").innerText = `Count: ${totalSoldCars}`;
            document.getElementById("totalSoldPrice").innerText = `₹${totalSoldPrice}`;
            document.getElementById("totalProfit").innerText = `₹${totalProfit}`;
        }

        // Car Price Prediction Function
        let currentPredictionData = null;

        async function predictPrice() {
            const resultDiv = document.getElementById('predictionResult');
            const predictBtn = document.querySelector('.predict-btn');
            
            // Get form values
            const predictionData = {
                brand: document.getElementById('predBrand').value,
                year: parseInt(document.getElementById('predYear').value),
                km_driven: parseFloat(document.getElementById('predKmDriven').value),
                mileage: parseFloat(document.getElementById('predMileage').value),
                engine: parseFloat(document.getElementById('predEngine').value),
                max_power: parseFloat(document.getElementById('predMaxPower').value),
                fuel: document.getElementById('predFuel').value,
                transmission: document.getElementById('predTransmission').value,
                seller_type: document.getElementById('predSellerType').value,
                owner: document.getElementById('predOwner').value,
                seats: parseInt(document.getElementById('predSeats').value)
            };

            // Store for later use
            currentPredictionData = predictionData;

            // Validate inputs
            if (isNaN(predictionData.year) || isNaN(predictionData.km_driven)) {
                resultDiv.innerHTML = '<div class="prediction-error">Please fill in all required fields correctly.</div>';
                return;
            }

            // Show loading
            predictBtn.disabled = true;
            predictBtn.innerHTML = '<span class="loading"></span>Predicting...';
            resultDiv.innerHTML = '';

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(predictionData)
                });

                const data = await response.json();

                if (data.success) {
                    const carModel = document.getElementById('predModel').value || 'Unknown Model';
                    resultDiv.innerHTML = `
                        <div class="prediction-result">
                            <h3><i class="fas fa-check-circle"></i> Estimated Price</h3>
                            <div class="price">₹${data.predicted_price.toLocaleString('en-IN')}</div>
                            <p style="color: rgba(255,255,255,0.7); margin-top: 10px;">
                                Based on: ${predictionData.year} year, ${predictionData.km_driven.toLocaleString('en-IN')} km driven, ${predictionData.fuel} ${predictionData.transmission}
                            </p>
                            <button class="sell-btn" style="margin-top: 20px;" onclick="sellPredictedCar(${data.predicted_price})">
                                <i class="fas fa-tag"></i> Sell This Car
                            </button>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `<div class="prediction-error">Error: ${data.error || 'Prediction failed'}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="prediction-error">Error: ${error.message}. Make sure the prediction service is running.</div>`;
            } finally {
                predictBtn.disabled = false;
                predictBtn.innerHTML = '<i class="fas fa-calculator"></i> Predict Price';
            }
        }

        // Function to sell the predicted car directly
        function sellPredictedCar(predictedPrice) {
            if (!currentPredictionData) {
                alert('Please predict a car first!');
                return;
            }

            const brand = currentPredictionData.brand;
            const model = document.getElementById('predModel').value || 'Unknown Model';
            const year = currentPredictionData.year;
            const fuel = currentPredictionData.fuel;
            const transmission = currentPredictionData.transmission;
            
            // Ask for final selling price (allow user to adjust)
            const sellingPrice = prompt(
                `Enter your selling price for ${brand} ${model} (₹):`,
                Math.round(predictedPrice).toString()
            );

            if (sellingPrice === null || isNaN(sellingPrice) || Number(sellingPrice) <= 0) {
                alert('Please enter a valid selling price!');
                return;
            }

            // Create car object
            const car = {
                brand: brand,
                model: model + ` (${year}, ${fuel}, ${transmission})`,
                originalPrice: 0, // No original price for predicted cars
                sellingPrice: Number(sellingPrice),
                predictedPrice: predictedPrice,
                year: year,
                km_driven: currentPredictionData.km_driven,
                fuel: fuel,
                transmission: transmission,
                seller_type: currentPredictionData.seller_type,
                owner: currentPredictionData.owner,
                seats: currentPredictionData.seats,
                mileage: currentPredictionData.mileage,
                engine: currentPredictionData.engine,
                max_power: currentPredictionData.max_power,
                dateAdded: new Date().toISOString()
            };

            // Add to sell cars
            let sellCars = JSON.parse(localStorage.getItem("sellCars")) || [];
            sellCars.push(car);
            localStorage.setItem("sellCars", JSON.stringify(sellCars));

            alert(`✅ ${brand} ${model} added to Cars for Sell at ₹${Number(sellingPrice).toLocaleString('en-IN')}!`);
            
            // Clear the form
            document.getElementById('predModel').value = '';
            document.getElementById('predictionResult').innerHTML = '';
            currentPredictionData = null;
        }
    </script>
</body>
</html>
